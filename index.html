<!DOCTYPE html>
<html lang="en">
<head>

<script src="photos/counts.js?v=16"></script>
<meta charset="utf-8">

<title>Justin Joonseo Choi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=EB+Garamond:ital,wght@0,500;1,500&family=Archivo+Expanded:wght@700;800&family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&family=Anton&display=swap">
<style>
  :root{
    --bg:#f3f0e9; --card:#ebe7dd; --ink:#141412; --dim:#75726b;
    --line:rgba(20,20,18,.13); --acc:#1f4fff;
    --disp:"Inter Tight","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --pad:clamp(20px,4.5vw,72px);
    --tsize:clamp(3rem,15vw,17rem);
    --seam:transparent;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ background:var(--bg); }
  body{ background:var(--bg); color:var(--ink); font-family:var(--disp); font-weight:500; overflow-x:clip; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--acc); color:#fff; }
  :focus-visible{ outline:2px solid var(--acc); outline-offset:3px; }
  img{ display:block; max-width:100%; }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:var(--mono); }
  .f-inter{ font-family:var(--disp); } .f-garamond{ font-family:"EB Garamond",Georgia,serif; }
  .f-archivo-wide{ font-family:"Archivo Expanded",var(--disp); } .f-archivoblack{ font-family:"Archivo Black",var(--disp); }
  .f-mono{ font-family:"JetBrains Mono",var(--mono); }
  .f-oswald{ font-family:"Oswald",var(--disp); } .f-anton{ font-family:"Anton",var(--disp); }

  #cursor,#cursorDot{ position:fixed; top:0; left:0; pointer-events:none; z-index:96; mix-blend-mode:difference; will-change:transform; }
  #cursor{ width:28px; height:28px; margin:-14px 0 0 -14px; border:2px solid #fff; border-radius:50%; transition:width .18s ease,height .18s ease,margin .18s ease,background .18s ease,opacity .15s ease; }
  #cursorDot{ width:13px; height:13px; margin:-6.5px 0 0 -6.5px; background:#fff; border-radius:50%; }
  #cursor.hot{ width:58px; height:58px; margin:-29px 0 0 -29px; background:rgba(255,255,255,.14); }
  #cursor.hide,#cursorDot.hide{ opacity:0; }
  body.cursor-on, body.cursor-on *{ cursor:none !important; }

  #tb{ position:fixed; top:0; left:0; right:0; z-index:40; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:15px var(--pad); background:transparent; transition:background .3s; }
  #tbName{ font:800 13px/1 var(--disp); letter-spacing:.02em; text-transform:uppercase; color:#fff; transition:color .3s; }
  #tbNav{ display:flex; gap:clamp(14px,2.4vw,32px); }
  #tbNav a{ font:500 11px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.85); transition:color .3s; }
  #tbNav a:hover{ color:var(--acc); }
  #tbNav a.on{ text-decoration:underline; text-underline-offset:5px; }
  body.nav-light #tb{ background:rgba(243,240,233,.94); border-bottom:1px solid var(--line); }
  body.nav-light #tbName{ color:var(--ink); }
  body.nav-light #tbNav a{ color:var(--dim); }
  body.nav-light #tbNav a:hover{ color:var(--acc); }
  @media (max-width:560px){ #tbName{ font-size:11px; } #tbNav a{ font-size:10px; letter-spacing:.1em; } }

  .side{ position:fixed; top:50%; z-index:30; transform:translateY(-50%); font:500 10.5px/1 var(--mono); letter-spacing:.28em; text-transform:uppercase; color:rgba(255,255,255,.7); pointer-events:none; transition:color .3s, opacity .3s; }
  #sideL{ left:14px; } #sideR{ right:14px; }
  body.nav-light .side{ color:var(--dim); }
  body.viewing .side, body.in-photo .side{ opacity:0; }
  @media (max-width:720px){ .side{ display:none; } }

  #panels{ position:relative; z-index:0; }
  .panel{ position:relative; height:100svh; background-size:cover; background-position:center; background-color:#0b0d12; border-top:3px solid var(--seam); }
  .panel:first-child{ border-top:0; }
  .panel::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,8,12,.42) 0%, rgba(8,8,12,.14) 34%, rgba(8,8,12,.16) 66%, rgba(8,8,12,.5) 100%); }

  #hud{ position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0; transition:opacity .4s ease; }
  #hud.show{ opacity:1; }
  .htitle{ position:fixed; left:0; top:0; transform-origin:left top; pointer-events:auto; cursor:pointer; will-change:transform,opacity; }
  .htitle .ht-in{ display:inline-block; white-space:nowrap; color:#fff; font-weight:800; text-transform:uppercase; font-size:var(--tsize); line-height:.8; letter-spacing:-.04em; text-shadow:0 2px 40px rgba(0,0,0,.35); transform-origin:left center; transition:transform .28s cubic-bezier(.2,.8,.2,1); }
  .htitle:hover .ht-in{ mix-blend-mode:difference; transform:scale(1.06) translateX(.02em); }

  /* SKILLS — big crowded words, photo on its own parallax */
  #skills{ position:relative; z-index:2; background:var(--bg); color:var(--ink); isolation:isolate; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); padding:clamp(70px,10vh,120px) var(--pad); overflow:hidden; }
  #skills .sk-lbl{ position:relative; z-index:3; display:flex; gap:14px; align-items:baseline; font:500 11px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--ink); margin-bottom:clamp(18px,3vh,32px); }
  .sk-stage{ position:relative; min-height:min(96vh,1000px); }
  .sk-photo{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(58%,860px); height:72%; border:1px solid rgba(20,20,18,.5); overflow:hidden; z-index:1; will-change:transform; }
  .sk-photo img{ width:100%; height:100%; object-fit:cover; }
  .sk-col{ position:absolute; z-index:2; display:flex; flex-direction:column; gap:.02em; mix-blend-mode:difference; color:#fff; font-weight:800; text-transform:uppercase; letter-spacing:-.03em; font-size:clamp(0.9rem,4.2vw,4.6rem); line-height:.96; white-space:nowrap; max-width:54%; }
  .sk-left{ top:-2%; left:0; align-items:flex-start; }
  .sk-right{ bottom:-2%; right:0; text-align:right; align-items:flex-end; }
  .sk-tools{ position:relative; z-index:3; margin-top:clamp(28px,5vh,56px); padding-top:20px; border-top:1px solid var(--ink); font:500 12px/1.85 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  @media (max-width:760px){ .sk-photo{ width:88%; height:54%; } .sk-col{ font-size:clamp(0.8rem,4.4vw,2rem); } .sk-left{ top:0; } .sk-right{ bottom:0; } }
  @media (max-width:420px){ .sk-col{ font-size:clamp(0.72rem,4.3vw,1.4rem); } .sk-photo{ width:92%; height:48%; } }

  #hfoot{ position:relative; z-index:2; background:var(--bg); display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; padding:26px var(--pad); font:500 10px/1.8 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  #hfoot a:hover{ color:var(--acc); }

  #view{ min-height:100svh; padding:96px var(--pad) clamp(80px,10vh,140px); background:var(--bg); }
  #view.vin > .shell{ animation:vin .38s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes vin{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  .shell{ max-width:1600px; margin:0 auto; }
  #backBtn{ display:inline-flex; align-items:center; gap:10px; font:500 11px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--dim); padding:10px 0; margin-bottom:clamp(20px,3.5vh,40px); transition:color .2s; }
  #backBtn:hover{ color:var(--acc); }
  .vlbl{ display:flex; gap:14px; align-items:baseline; font:500 11px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--acc); margin-bottom:clamp(18px,3vh,30px); }
  .vlbl .ix{ color:var(--dim); }
  .vtitle{ font-weight:800; text-transform:uppercase; letter-spacing:-.03em; font-size:clamp(2.6rem,9vw,8.5rem); line-height:.92; margin-bottom:clamp(20px,3vh,34px); }
  .vintro{ max-width:60ch; font-size:clamp(1rem,1.5vw,1.2rem); line-height:1.55; color:var(--dim); margin-bottom:clamp(36px,6vh,66px); }
  .exp-title{ display:block; width:100%; overflow:hidden; margin:0 0 clamp(22px,3.4vh,44px); line-height:.8; text-transform:uppercase; font-weight:800; color:var(--ink); }
  .exp-in{ position:relative; display:inline-block; transform-origin:left center; white-space:nowrap; will-change:transform; }
  .exp-base{ position:relative; z-index:0; }
  .work-exp .exp-glare{ position:absolute; inset:0; z-index:1; pointer-events:none; background-image:repeating-linear-gradient(118deg,#61bb46 0 34px,#f9c22e 34px 68px,#f5821f 68px 102px,#e03a3e 102px 136px,#963d97 136px 170px,#009ddc 170px 204px); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; -webkit-mask-image:linear-gradient(118deg, transparent 0 25%, #000 25% 75%, transparent 75% 100%); mask-image:linear-gradient(118deg, transparent 0 25%, #000 25% 75%, transparent 75% 100%); -webkit-mask-size:400% 100%; mask-size:400% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position-x:0%; mask-position-x:0%; animation:glareSlant 4.6s cubic-bezier(.55,0,.45,1) infinite; }
  @keyframes glareSlant{ 0%{ -webkit-mask-position-x:0%; mask-position-x:0%; } 42%{ -webkit-mask-position-x:45%; mask-position-x:45%; } 58%{ -webkit-mask-position-x:55%; mask-position-x:55%; } 100%{ -webkit-mask-position-x:100%; mask-position-x:100%; } }
  @media (prefers-reduced-motion:reduce){ .work-exp .exp-glare{ animation:none; -webkit-mask-position-x:50%; mask-position-x:50%; } }
  .exp-title.f-garamond{ font-weight:500; } .exp-title.f-archivoblack{ font-weight:400; } .exp-title.f-mono{ font-weight:700; }
  .work-exp{ font-size:clamp(3rem,15.5vw,12.5rem); }
  .photo-title{ font-size:clamp(3rem,15vw,12rem); border-bottom:3px solid currentColor; padding-bottom:clamp(6px,1.2vh,16px); margin-bottom:clamp(30px,5vh,64px); }
  #mfoot{ position:relative; z-index:2; display:block; width:100%; box-sizing:border-box; overflow:hidden; line-height:.78; text-transform:uppercase; font-weight:800; color:var(--fink,var(--ink)); background:var(--fbg,var(--bg)); padding:clamp(22px,4vh,56px) clamp(8px,2vw,22px) clamp(26px,5vh,66px); cursor:pointer; font-size:clamp(2.2rem,12.5vw,11rem); transition:color .3s ease, background .45s ease, border-color .45s ease; }
  #mfoot:hover{ color:var(--facc,var(--acc)); }
  #mfAtmos{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #mfAtmos .loc-atmos{ position:absolute; inset:0; overflow:hidden; }
  #mfAtmos .loc-atmos::before{ display:none; }
  .mf-in{ position:relative; z-index:1; }
  body.in-photo #view{ padding-bottom:0; }
  .photo-hd{ position:relative; color:var(--link); margin:-400px calc(50% - 50vw) 0; padding:400px calc(50vw - 50%) 1px; }
  body.in-photo #view{ background:var(--plbg); }
  body.in-photo #backBtn{ position:relative; z-index:2; color:var(--plink); }
  .photo-hd > :not(.loc-atmos){ position:relative; z-index:1; }
  .photo-hd > .loc-atmos{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .photo-hd .vlbl{ color:var(--lacc); } .photo-hd .vlbl .ix{ color:var(--ldim); }
  .photo-hd .photo-title{ color:var(--link); border-bottom:0; box-shadow:none; }
  body.in-photo.nav-light #tb{ background:color-mix(in srgb, var(--plbg) 94%, transparent); border-bottom:1px solid var(--pldim); }
  body.in-photo #tb a, body.in-photo #tb button, body.in-photo #tbName{ color:var(--plink); transition:color .45s ease; }
  body.in-photo #tb{ transition:background .45s ease, border-color .45s ease; }
  body.in-photo #tbNav a:hover, body.in-photo #tbNav a.on{ color:var(--placc,var(--plink)); }
  .mfoot-3{ display:none; }
  .mfoot-3 .mfl{ display:block; }
  .mfoot-3 .exp-in{ font-size:clamp(3rem,19vw,7rem); }
  @media (max-width:600px){ .mfoot-1{ display:none; } .mfoot-3{ display:block; } }

  .wgrid{ display:grid; grid-template-columns:1fr; gap:clamp(18px,2.4vw,30px); }
  @media (min-width:820px){ .wgrid{ grid-template-columns:1fr 1fr; } }
  .wcard{ border:0; background:#fff; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; box-shadow:0 2px 16px rgba(20,20,18,.07); transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; }
  .wcard:hover{ transform:translateY(-4px); box-shadow:0 16px 34px rgba(20,20,18,.16); }
  .wcard-img{ aspect-ratio:16/10; overflow:hidden; background:var(--card); }
  .wcard-img img{ width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .wcard-ph{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--card); color:rgba(20,20,18,.16); font:800 clamp(2rem,4.5vw,3.6rem)/1 var(--disp); letter-spacing:-.02em; }
  .wcard:hover .wcard-img img{ transform:scale(1.045); }
  .wcard-body{ padding:clamp(18px,1.8vw,26px); display:flex; flex-direction:column; gap:12px; }
  .wc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .wc-title{ font-weight:800; text-transform:uppercase; font-size:clamp(1.25rem,2.3vw,1.9rem); letter-spacing:-.02em; line-height:1.02; }
  .wc-year{ font:600 10px/1 var(--mono); letter-spacing:.1em; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:6px 10px; white-space:nowrap; }
  .wc-desc{ color:var(--dim); font-size:clamp(.95rem,1.3vw,1.05rem); line-height:1.5; }
  .wc-stat{ display:flex; align-items:baseline; gap:10px; border-top:1px solid var(--line); padding-top:12px; }
  .wc-num{ font-weight:800; font-size:clamp(1.6rem,2.8vw,2.3rem); letter-spacing:-.03em; line-height:1; color:var(--ink); white-space:nowrap; }
  .wc-lbl{ font:600 10px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .wd-stats{ display:flex; flex-wrap:wrap; gap:clamp(18px,3vw,36px); margin:0 0 clamp(22px,3vh,32px); }
  .wd-stat{ display:flex; flex-direction:column; gap:6px; }
  .wd-pt{ margin-top:.7em; } .wd-pt strong{ font-weight:700; }
  .wd-cap{ font:600 10px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-top:8px; }
  figure.wd-img{ margin-top:clamp(20px,3vh,30px); }
  .wd-tags{ margin-top:clamp(20px,3vh,30px); }
  .wd-link{ display:inline-block; margin-top:18px; font:600 12px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--ink); border-radius:999px; padding:12px 18px; text-decoration:none; }
  .wd-link:hover{ background:var(--ink); color:#fff; }
  .wd-note{ margin-top:14px; font-size:.82rem; color:var(--dim); }
  .wd-cs + .wd-cs{ margin-top:1.4em; }
  .wd-csk{ display:block; font:600 10px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:.6em; }
  .pebbles{ display:flex; flex-wrap:wrap; gap:7px; }
  .pebble{ font:600 9.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 11px; }


  /* PRODUCT: clean case-study portfolio, deliberately unlike the rest of the site */
  body.in-product #view{ background:#fff; color:#111; }
  body.in-product #view > .shell{ max-width:1180px; margin:0 auto; }
  body.in-product #backBtn{ color:#888; }
  .pp-eyebrow{ font:500 13px/1 var(--disp); color:#6b6b6b; letter-spacing:0; }
  .pp-hero{ position:relative; }
  .pp-deco{ position:absolute; right:0; top:50%; width:min(38vw,420px); transform:translateY(-50%); pointer-events:none; }
  @media (max-width:900px){ .pp-deco{ position:relative; top:auto; right:auto; transform:none; width:min(100%,380px); margin:10px auto 0; } }
  .pp-deco svg{ width:100%; height:auto; overflow:visible; }
  .pp-deco [class*="pp-f"]{ transform-box:fill-box; transform-origin:center; animation:ppFloat 10s ease-in-out infinite; }
  .pp-deco .pp-f2{ animation-duration:9s; animation-delay:-2s; } .pp-deco .pp-f3{ animation-name:ppSpin; animation-duration:48s; animation-timing-function:linear; }
  .pp-deco .pp-f4{ animation-duration:12s; animation-delay:-5s; } .pp-deco .pp-f5{ animation-duration:11s; animation-delay:-3s; } .pp-deco .pp-f6{ animation-duration:13s; }
  @keyframes ppFloat{ 50%{ transform:translateY(-14px); } }
  @keyframes ppSpin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .pp-deco [class*="pp-f"]{ animation:none; } }
  .pp-mark{ position:relative; white-space:nowrap; background:linear-gradient(transparent 62%, #f9c22e 62% 92%, transparent 92%); padding:0 .06em; }
  .pp-hero{ padding:clamp(28px,6vh,72px) 0 clamp(36px,6vh,64px); border-bottom:1px solid #ececec; }
  .pp-h{ font:500 clamp(2.1rem,5.2vw,4.4rem)/1.04 var(--disp); letter-spacing:-.035em; max-width:14ch; margin:18px 0 22px; }
  .pp-sub{ max-width:58ch; font:400 clamp(1rem,1.4vw,1.15rem)/1.6 var(--disp); color:#555; }
  .pp-index{ list-style:none; margin:0; padding:0; border-bottom:1px solid #ececec; }
  .pp-index a{ display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:12px; padding:18px 0; border-top:1px solid #ececec; text-decoration:none; font:500 clamp(1rem,1.6vw,1.25rem)/1.2 var(--disp); color:#111; transition:padding .25s; }
  .pp-index li:first-child a{ border-top:0; }
  .pp-index a:hover{ padding-left:10px; }
  .pp-n{ font:500 12px/1 var(--mono); color:#999; }
  .pp-st{ font:500 11px/1 var(--disp); padding:6px 10px; border-radius:999px; white-space:nowrap; }
  .pp-st.s-done{ background:#e9f6ee; color:#1c7a45; } .pp-st.s-wip{ background:#fdf3e1; color:#9a6200; }
  .pp-case{ display:grid; gap:clamp(24px,4vw,64px); padding:clamp(56px,10vh,120px) 0; border-bottom:1px solid #ececec; scroll-margin-top:70px; }
  @media (min-width:900px){ .pp-case{ grid-template-columns:5fr 7fr; align-items:center; } .pp-case:nth-of-type(even) .pp-tx{ order:2; } }
  .pp-t{ font:600 clamp(1.8rem,3.4vw,2.8rem)/1.05 var(--disp); letter-spacing:-.03em; margin:14px 0 14px; }
  .pp-d{ font:400 clamp(1rem,1.3vw,1.1rem)/1.6 var(--disp); color:#444; }
  .pp-meta{ display:grid; grid-template-columns:auto 1fr; gap:8px 20px; margin:22px 0; font:400 14px/1.4 var(--disp); }
  .pp-meta dt{ color:#999; } .pp-meta dd{ margin:0; color:#111; }
  .pp-stat{ display:flex; align-items:baseline; gap:12px; padding:16px 0; border-top:1px solid #ececec; border-bottom:1px solid #ececec; }
  .pp-sn{ font:600 clamp(1.8rem,3vw,2.5rem)/1 var(--disp); letter-spacing:-.03em; } .pp-sl{ font:400 14px/1.3 var(--disp); color:#666; }
  .pp-go{ margin-top:22px; font:500 15px/1 var(--disp); color:#111; border-bottom:1px solid #111; padding:0 0 4px; }
  .pp-lk{ display:inline-block; margin-left:22px; text-decoration:none; }
  .pp-go:hover{ color:#0a58ff; border-color:#0a58ff; }
  .pp-img{ min-height:240px; border-radius:18px; overflow:hidden; background:#f3f3f1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .pp-img img{ width:auto; max-width:100%; height:auto; max-height:70vh; object-fit:contain; transition:transform .6s cubic-bezier(.2,.7,.2,1); }
  .pp-img:hover img{ transform:scale(1.03); }
  .pp-ph{ font:600 clamp(1.4rem,3vw,2.2rem)/1 var(--disp); color:#c9c9c4; letter-spacing:-.02em; }
  /* full-screen case study */
  #wdrawer.pcase .wd-panel{ width:100vw; border-left:0; background:#fff; color:#111; padding:clamp(60px,9vh,110px) var(--pad) 120px; }
  #wdrawer.pcase #wdBody{ max-width:860px; margin:0 auto; }

<script>
"use strict";

const SITE = {
  name: "Justin Joonseo Choi",
  sideL: "Builder", sideR: "©2026",
  artLink: "https://chillchoi.github.io/artportfolio/",

  product: [
    {"title": "Booth Host Kiosk", "status": "Shipped", "img": "photos/product/kiosk.jpg", "desc": "A voice and touch kiosk that I designed, built, and ran live for a financial company's booth at a large international event.", "meta": [["Role", "Sole designer and builder"], ["Client", "Financial company"], ["Timeline", "2026, live for 5 days"], ["Platform", "9:16 touch kiosk, Korean and English"]], "stats": [["5 days", "live with zero downtime"], ["52", "voice clips"], ["8+", "screens, voice and touch"]], "tags": ["Three.js", "Next.js", "Web Audio API", "Soniox streaming STT", "AWS Amplify"], "link": null, "pm": [["Target", "Visitors walking past a busy booth who speak different languages and have never used a kiosk like this before"], ["Impact", "I shipped same-day fixes while the kiosk was running and checked each one on the live screen within about 60 seconds"], ["Leads to", "Proof that Klleon can ship and run a live interactive install for an event client"]], "glance": [["My role", "Sole designer and builder, and the person who kept it running live on the floor."], ["Problem", "A financial company's booth had to greet and hold a large international crowd, and nobody else was assigned to design or build it."], ["Outcome", "The kiosk ran all 5 days of the event with zero downtime, and I shipped same-day fixes while it was live."]], "skills": ["Voice UX", "Live ops", "Performance"], "flow": [["Context", "text", "Klleon's founder handed me this project with a single line, which was to make a small robot that people could talk to. A financial company needed its booth to greet a large international crowd, explain what was in the exhibition, and keep people around long enough to care about the brand. There was no designer and no engineer assigned to it, so every screen and every line of code started with me."], ["Users and insight", "text", "I pictured someone walking past the booth with a few seconds of attention, who might not speak Korean, and who has no reason to trust a screen they have never seen before. Because of that, I decided early that the kiosk should start the conversation itself, so that nobody would have to figure out where to tap first."], ["Goals and what success meant", "checks", ["A visitor can go from walking past the booth to talking with the mascot without any help from staff.", "The kiosk stays up for all 5 days.", "Narration is clear in both Korean and English on a loud exhibition floor.", "People have a reason to stay after the greeting, which is the job of the quiz."]], ["Process", "timeline", [["Brief", "One line from the founder, which was a small robot people could talk to."], ["Design", "I mapped the flow across 8 or more screens, from the home screen and menu to the 3D map, the quiz, robot activation, and the celebration."], ["Build", "Voice on Soniox streaming speech-to-text with a wake word and 8 command types, a Three.js map, and 52 pre-generated voice clips."], ["Harden", "Before the doors opened I fixed a 1 to 2 second lag, a half-resolution canvas bug, and stale caching."], ["Run live", "5 days on AWS Amplify, with same-day fixes that I checked on the live kiosk in about 60 seconds."]]], ["What I built", "points", [["Voice greeting and commands.", "A mascot greets visitors and answers to her name. I built the voice side on Soniox streaming speech-to-text with a wake word and 8 voice command types, such as start, map, and quiz, each with many phrasings in both languages, and I generated 52 voice clips, 26 prompts in Korean and English, so every prompt had both versions."], ["3D map of the hall.", "I built a 3D model of the exhibition hall in Three.js with about 13 booths on it, and each booth has its own spoken narration, so the kiosk was useful to people who just wanted to find something."], ["True or false quiz.", "I added a two-round true or false quiz where every right answer charges up a robot, which ends in a celebration screen, because I wanted people to have a reason to stay at the booth after the greeting."], ["Louder English narration.", "The exhibition floor was loud, so I used the Web Audio API to push the English narration to 1.5 times the browser's normal volume limit, while keeping the Korean audio exactly as it was."]]], ["Key decisions and tradeoffs", "decisions", [["Voice first, with touch as the backup", "A touch menu like most kiosks use", "Touch alone is cheaper and never mishears, but a visitor who does not read Korean can start just by saying the mascot's name. The cost was speech recognition on a loud floor, so I added a wake word, many phrasings per command in both languages, and cooldowns against false triggers, and kept touch as the backup."], ["Reliability over extra features", "Adding more screens and effects before the event", "A crash in front of an international crowd could not be undone, so I spent the last stretch before the event removing lag and fixing caching, because a new effect was worth less than a kiosk that stayed up."]]], ["Engineering for a live event", "text", "Before the event, I traced a 1 to 2 second lag to a drop shadow redrawn every frame and an animation loop that never stopped, fixed a half-resolution canvas that tinted half the screen, cut the main images by about 28 to 40 percent, and set up cache headers and versioned files so every fix reached the kiosk. During the 5 days I shipped same-day fixes through AWS Amplify, checked each one on the live kiosk within about 60 seconds, and kept the speech keys on the server as single-use keys that expire after 300 seconds."], ["Results", "text", "The kiosk ran for all 5 days of the event with zero downtime."], ["What I learned", "list", ["When a correct fix does not seem to work, I now check for stale files before I rewrite any code, because caching caused most of my scariest moments.", "I shipped without usage tracking, so I can prove the kiosk stayed up but not how many people finished the quiz. Now I decide what to measure and start logging it before launch.", "During a live event I could not fully test ahead of time, I only shipped fixes I was sure could not break a screen that already worked."]], ["What's next", "text", "Klleon can now show event and retail clients an install that ran in public for 5 days. On the next install I would add session and quiz-completion tracking from day one, so the report covers how many people finished the quiz as well as the uptime."]], "stages": ["Define", "Design", "Build", "Launch", "Measure", "Iterate"], "gallery": [["photos/product/kiosk.jpg", "The kiosk on the exhibition floor, with the client's branding blurred"]]},
    {"title": "VivaTech Conversation Analysis", "status": "Analysis done", "img": "photos/product/expo_booth.jpg", "desc": "I analyzed the conversation logs from a Klleon avatar that ran the front desk of the Samsung booth at VivaTech 2026 in Paris, found that small talk almost never turned toward a product on its own, and designed the A/B test to change that.", "meta": [["Role", "Analysis and report, on my own"], ["Client", "Klleon, for the Samsung booth"], ["Timeline", "June 2026, VivaTech in Paris"], ["Platform", "Conversation logs in several languages"]], "stats": [["2", "ways to earn from the avatar's attention"], ["1", "A/B test designed for the next event"]], "skills": ["Data analysis", "Experiment design"], "tags": ["Data cleaning", "Funnel analysis", "A/B test design", "Monetization"], "link": null, "pm": [["Target", "Brands like Samsung that put a Klleon avatar on their floor and want visitors to reach a product, a signup, or a demo"], ["Impact", "Showed that visitors gave the avatar sustained attention but small talk rarely turned toward a product, and turned that into two revenue paths and a test plan"], ["Leads to", "A goal mode Klleon can build once and switch on for any brand partner"]], "glance": [["My role", "I pulled the logs, cleaned them, ran every number, and wrote the report on my own."], ["Problem", "Klleon knew visitors talked to its avatar at the Samsung booth, but not what they talked about or how that attention could turn into something a client pays for."], ["Outcome", "A report that proposed a goal mode, an A/B test to prove it, and two ways to earn from the avatar's attention."]], "stages": ["Discover", "Define", "Measure"], "flow": [["Context", "text", "Klleon ran one of its avatars as the AI promoter at the front desk of the Samsung booth at VivaTech 2026 in Paris, answering visitors in several languages. After the event I pulled the conversation logs to find out what visitors did with it and where the business value was."], ["Cleaning the data first", "text", "A session-timeout bug had merged many visitors into a few oversized sessions for the first few days. I cut those days and rebuilt every number on the clean days only, because merged sessions would have made every per-session rate wrong."], ["What I found", "list", ["Visitors stayed for long conversations, and most of them came back with a second question.", "Most of what visitors said went to the avatar's personality, even though only a small slice of the knowledge base was built for it.", "Left alone, a conversation almost never moved from small talk to a product.", "Conversations that opened on a Samsung topic reached a product far more often than ones that stayed in small talk."]], ["Key decisions and tradeoffs", "decisions", [["Cut the buggy days entirely", "Keeping them and adjusting for the bug", "I could not trust any per-session rate built on merged sessions."], ["Propose a goal mode where the avatar steers a turn or two in", "Loading more product facts into the knowledge base", "Visitors already talked past most of the facts, and the way a conversation opened already predicted where it ended up."]]], ["The test I designed", "text", "At the next event, run the current passive avatar against one that steers toward what the partner cares about, such as a product, a signup, or a demo booking. The main metric is the share of visitors who reach that outcome, measured against the baseline from this event."], ["Two ways to earn from it", "list", ["Intent data. Every conversation records what visitors asked, in which language, and where they wanted to go, which a brand can use on its own.", "Goal mode. A feature built once and switched on for any brand partner, sold as an outcome a client can put a number on."]], ["What I learned", "list", ["Before I compute anything from an export, I now check that each session is a single visit, because the timeout bug would have inflated several days of results if I had taken the export as it was."]], ["Status", "text", "The report proposed the test for the next event. I have not put a dollar figure on goal mode yet, because the lead and token costs were not in this dataset. The exact numbers stay internal to Klleon."]], "gallery": [["photos/product/expo_booth.jpg", "Klleon's avatar working the front desk of the Samsung booth at VivaTech 2026"]]},
    {"title": "Glow Buddy", "status": "Prototype", "img": "photos/product/retail_01.jpg", "gallery": [["photos/product/retail_01.jpg", "The avatar on a foldable phone"], ["photos/product/retail_02.jpg", "A visitor's finished book cover"], ["photos/product/retail_03.jpg", "Me with one of Klleon's avatars during testing"]], "desc": "A digital human for a phone maker's stores that either answers spoken questions about the phone a customer is holding or takes them on a passport mission built around the way a foldable phone opens.", "meta": [["Role", "Concept, design and build"], ["Client", "Phone maker, retail"], ["Timeline", "Prototype in 3 weeks, 99 builds"], ["Platform", "Foldable phone, Android app"]], "stats": [["3 wks", "to a working prototype"], ["99", "builds"]], "tags": ["Interaction design", "Fold detection", "Scene state machine", "Klleon avatar SDK", "Speech Q&A", "Android"], "link": null, "pm": [["Target", "Shoppers who pick up a new phone in a store and have nobody nearby to explain it to them"], ["Impact", "A working prototype in 3 weeks, refined over 99 builds of testing and fixes"], ["Leads to", "A use case the phone maker can test on its display phones"]], "glance": [["My role", "Concept, design, and build, on my own from the first idea to the working app."], ["Problem", "Shoppers who pick up a new foldable in a store often have nobody to explain it, and Klleon needed a use for its avatar that the phone maker would want too."], ["Outcome", "A working prototype in 3 weeks, packaged as an Android app for foldable phones and refined over 99 builds with feedback from the client's agency and visitors."]], "skills": ["Interaction design", "Prototyping", "Scoping"], "flow": [["Context", "text", "Klleon's founder wanted our digital humans running on every phone on display in a major phone maker's stores, and he asked me to find the reason the phone maker would want that. My answer was that a customer who picks up a phone in a store should not have to figure it out alone. His only other direction was to make it a mission, plus a mention that one of the brand's partners could be interesting, so every feature that made it in, and every feature I cut, was my call."], ["Users and insight", "text", "I saw two kinds of shoppers, which I started calling explorers and deciders. Explorers want an experience and are happy to play, and deciders just want a quick answer about the phone before they buy. So the app had to give deciders a fast way to ask their question without sitting through the mission first. A foldable phone opens like a book, so I made opening it part of the story, and a visitor builds their own passport while using the one feature that makes a foldable different from other phones."], ["Goals and what success meant", "checks", ["A shopper can get an answer about the phone just by asking out loud.", "Opening the phone becomes part of the story, so using the app means using the feature that sets the phone apart.", "Explorers leave with something to keep, which is the certificate with a QR code.", "The app can be rebuilt for other phone models without starting over."]], ["Process", "timeline", [["Frame", "I turned the founder's goal into a customer problem, which is that nobody should have to figure out a phone alone."], ["Concept", "I designed the passport mission around the way the phone unfolds, plus an 8-question spoken Q&A."], ["Build", "A single-file web app inside an Android app shell, driven by a real-time Klleon avatar, with automatic fold detection."], ["Test", "Rounds of testing with the client's agency, Klleon's founder, and visitors, fixing speech failures and reworking the flow where people got stuck."], ["Deliver", "A working prototype for in-store foldable phones after 99 builds in 3 weeks."]]], ["What I built", "points", [["The passport mission.", "The visitor takes a selfie, picks a city, watches a short travel scene, takes an arrival photo with a filter for that city, and gets a certificate with a QR code they can download and take home."], ["Fold detection.", "The narrow cover screen and the wide inner screen each have their own layout. I wrote fold detection that reads the screen's aspect ratio, with a buffer so it does not flicker, and switches layouts on its own the moment the phone opens."], ["Spoken Q&A.", "For people who only want to know about the phone, the avatar answers an 8-question spoken Q&A about the device in their hand."], ["Custom book cover.", "Visitors design their own book cover, which ties back to one of the brand's partnerships."]]], ["Key decisions and tradeoffs", "decisions", [["Two paths, a mission and a quick spoken Q&A", "One mission that everyone has to go through", "Some shoppers only want an answer before they decide, and making them play a game first would lose them."], ["Automatic fold detection that switches layouts on its own", "A button asking the visitor to switch modes", "The moment someone opens the phone is the moment the story should move forward, so the app reacts by itself and uses a buffer so it does not flicker."]]], ["Testing and iteration", "text", "I tested it with the client side and with visitors over many rounds. Along the way I fixed text-to-speech and speech-to-text failures, reworked the mission flow when people got stuck, and redesigned the interface more than once."], ["Results", "text", "The prototype was working in 3 weeks and went through 99 builds based on feedback from the client's agency, Klleon's founder, and visitors."], ["What I learned", "list", ["Speech features that work fine at a desk can fail in a real store, so I now test voice with real people as early as I can.", "Because the founder left the scope to me, most of my time went into deciding what to build, and I learned to judge every feature by whether it helped the explorer, the decider, or neither."]], ["What's next", "text", "Next I would push to rebuild it for more phone models and measure how many shoppers finish the mission compared with how many only ask questions, because that split would tell the client which path to put first."]], "stages": ["Define", "Design", "Build", "Iterate"]},
    {"title": "Lab Platform Navigation Study", "status": "In progress", "img": "photos/product/lab_research.jpg", "gallery": [["photos/product/lab_screen.jpg", "The kind of dense lab workspace the new navigation has to organize"], ["photos/product/lab_research.jpg", "How we set up the 1:1 research sessions, with names blurred"]], "desc": "A biotech R&D software company is introducing new navigation to its lab data platform, and our team is finding out how each type of user reacts to it and which design changes would make them want to switch.", "meta": [["Role", "Contract Product Design Analyst"], ["Company", "Biotech R&D software company"], ["Timeline", "Sep 2026 to present"], ["Focus", "Navigation"]], "stats": [["6", "user types in the study"]], "tags": ["User interviews", "Think-aloud testing", "Behavioral clustering", "Persona segmentation", "Information architecture"], "pm": [["Target", "Scientists and admins who use a lab data platform every day, split into 6 user types"], ["Impact", "When the sessions finish, design changes ranked for each user type, so the team knows what to build first and for whom"], ["Leads to", "A navigation rollout that each group of users is more likely to adopt on their own"]], "glance": [["My role", "Contract Product Design Analyst on the research team."], ["Problem", "New navigation only pays off if the scientists and admins who use the platform every day adopt it."], ["Outcome", "In progress. The goal is a ranked list of design changes for each user type and cluster."]], "skills": ["User research", "Synthesis", "Segmentation", "Information architecture"], "flow": [["Context", "text", "The client makes a lab data platform that biotech and pharma teams use every day, and there is a lot in it to find. The company is now introducing new navigation concepts, and it needs the people who use the platform every day to adopt them."], ["The research question", "text", "We want to understand how core users move around the platform today, how they react to the new navigation, how those reactions differ from one type of user to another, and what changes would make them eager to switch."], ["Users", "text", "We are recruiting across 6 user types, from admins to bench scientists, computational biologists, team leads, molecular biologists, and chemists. Each of them uses the platform for different work, so I expect each of them to look for things in different places."], ["Goals and what success means", "checks", ["Understand how each of the 6 user types moves through the platform today.", "Capture first reactions to the new navigation through think-aloud sessions.", "Find the blockers and drivers of adoption that come up again and again.", "Rank design changes by impact for each persona and cluster, so the team knows what to build first."]], ["Process", "timeline", [["Recruit", "Participants across all 6 user types."], ["Sessions", "1:1 remote sessions that capture current habits and then a think-aloud reaction to the new concepts."], ["Tag", "Every session tagged for recurring adoption blockers and drivers."], ["Cluster", "Participants grouped by how they navigate, so distinct segments show up."], ["Recommend", "The highest-impact design changes for each persona and cluster."]]], ["What a session looks like", "text", "Each session is a 1:1 remote call with one person from one of the 6 user types, and we booked two formats, a 45-minute user research session and a shorter 25-minute UX session. In the first part we look at how the person gets around the platform today for their normal work. In the second part we show the new navigation concepts and ask them to think out loud as they react, so we hear the reason behind each reaction along with the reaction itself."], ["How we will read the data", "points", [["Tag every session.", "We tag each session for the blockers that stop someone from adopting the new navigation and the drivers that make them want it, so the same patterns show up across different people."], ["Compare by user type.", "We compare reactions across the 6 user types, because each type uses the platform for different work and looks for things in different places."], ["Cluster by behavior.", "We group participants by how they navigate, which can split one job title into several distinct segments."], ["Rank the changes.", "For each user type and each cluster, we rank the design changes by how much they would help people adopt the new navigation."]]], ["Key decisions and tradeoffs", "decisions", [["1:1 think-aloud sessions", "A survey sent to many users", "Navigation problems show up in what people do and say in the moment, which a survey answer usually misses."], ["Clustering people by how they navigate", "Only grouping people by job title", "Two scientists with the same title can move through the product very differently, and behavior-based clusters show that difference."]]], ["Who I work with", "chips", ["The client's product team", "Our research team"]], ["Deliverables", "text", "We will hand over a final presentation with case studies for each persona, along with an organized spreadsheet of all the session data, so the product team can keep slicing it after we are gone."], ["Status", "text", "The study runs this fall. Recruiting and the first sessions come first, then tagging and clustering, and then the ranked recommendations and the final presentation."], ["What's next", "text", "If we get this right, the client can roll out its new navigation in a way that matches how each group already works, which makes adoption much more likely to happen on its own. Once the sessions are done, the next step is turning the top-ranked changes into designs the team can build and test."]], "stages": ["Discover", "Define"]},
    {"title": "Caregiver Support System", "status": "In progress", "img": "photos/product/caregiver.jpg", "gallery": [["photos/product/caregiver.jpg", "Concept screen · choosing an AI supporter"]], "desc": "Klleon and a university medical research lab are developing a real-time AI companion for family caregivers, and I shaped the product concept and the pitch.", "meta": [["Role", "Product concept and pitch"], ["Partners", "Klleon × a university medical lab"], ["Stage", "Phase 1, research and prototype"], ["Platform", "Mobile, real-time video avatar"]], "stats": [["3", "supporter types in the concept"], ["30+", "caregivers planned for Phase 1 co-design"]], "tags": ["Concept design", "Persona design", "Co-design research", "Digital humans", "Healthcare AI"], "pm": [["Target", "Family caregivers who look after a relative without pay"], ["Impact", "The concept and pitch behind a Phase 1 research and prototype program with an academic medical partner"], ["Leads to", "A clinical validation trial and a path to users through a major health app in later phases"]], "glance": [["My role", "Product concept and pitch."], ["Problem", "Unpaid family caregivers often have nobody to turn to when they need help late at night."], ["Outcome", "The concept behind a Phase 1 research and prototype program with a university medical research lab."]], "skills": ["Concept design", "Healthcare", "Research planning", "Partnerships"], "flow": [["Context", "text", "About 59 million Americans care for an adult loved one, mostly without pay (AARP, 2026). Caregiver burnout is linked to worse outcomes for the person being cared for, and the support that exists today is scattered and generic, so nobody is there at 11pm when a caregiver needs help right away."], ["Users and insight", "text", "I kept picturing one person, which is a caregiver late at night who is tired, who has a practical question, and who also just needs someone to talk to. Most tools today handle the question or the feelings, but rarely both, so we wanted one conversation that could hold both."], ["Goals and what success means", "checks", ["Caregivers get practical and emotional support in the same conversation.", "People can pick the kind of support they need in the moment.", "The product is shaped by caregivers before it is built."]], ["Process", "timeline", [["Problem", "Sized the need, about 59 million Americans caring for an adult loved one, mostly without pay (AARP, 2026)."], ["Concept", "Three supporter types, a Health Guide, a Caring Companion, and a Care Navigator."], ["Pitch", "Shaped the concept and the pitch with Klleon and our academic medical partner."], ["Phase 1", "6 months of co-design with 30 or more caregivers and 30 evidence-based personas."], ["Later", "A clinical validation trial, then a path to users through a major health app."]]], ["The concept", "points", [["Three supporter types.", "Caregivers choose the AI supporter that fits the moment, which could be a Health Guide for clear information, a Caring Companion for emotional support, or a Care Navigator for next steps."], ["Live video avatar.", "Each supporter is a Klleon digital human that talks back live, so it feels like talking to a person who is there with you."], ["Practical and emotional help in one chat.", "A caregiver can vent and get a concrete next step in the same conversation, without switching between apps."]]], ["Key decisions and tradeoffs", "decisions", [["Three supporter types to choose from", "One general assistant", "A caregiver at 11pm might need facts, comfort, or a plan, and letting them choose keeps each conversation focused on that one need."], ["A live video avatar", "A text chatbot", "Seeing a face that talks back makes it feel like a person is there, which matters most when someone is exhausted."], ["Co-designing with 30 or more caregivers first", "Building a prototype first and testing it later", "The personas should come from caregivers themselves, so the product fits their lives from the start."]]], ["Who I worked with", "chips", ["Klleon", "Our academic medical partner"]], ["The plan", "text", "Phase 1 is a 6-month research and prototype program. We will co-design with 30 or more caregivers, build 30 evidence-based personas from that research, and deliver a working AI prototype that has been shaped by their feedback."], ["What I learned", "list", ["Because the partner was a medical research lab, I led the pitch with evidence, so the concept starts from the AARP numbers and ends with a clinical validation plan."]], ["What's next", "text", "Later phases plan a clinical validation trial and then a path to users through a major health app."]], "stages": ["Define", "Design"]}

  const home = $("home"), view = $("view"), viewBody = $("viewBody");

  const cur = $("cursor"), curDot = $("cursorDot");

  let rafId = 0, lastT = 0;
  function loop(now) { rafId = 0; const dt = clamp(now - lastT, 0, 50); lastT = now; const mul = dt / 16.666; try { navTheme(); hudTick(mul); skillsParallax(); updatePnav(); photoParallax(); } catch (e) {} if (!doc.hidden) rafId = requestAnimationFrame(loop); }
  function ensureRaf() { if (!rafId && !doc.hidden) { lastT = performance.now(); rafId = requestAnimationFrame(loop); } }
  doc.addEventListener("visibilitychange", () => { if (!doc.hidden) ensureRaf(); });
  let rt = 0;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(function () { measureHud(); refitTitles(); }, 160); });
  const BOUNCE = (n, big) => { let h = ""; const cols = ["#ff6b4a", "#4f7cff", "#1fae6a", "#9b5cff", "#f9c22e"]; for (let i = 0; i < n; i++) { const sz = big ? 26 + (i * 17) % 44 : 12 + (i * 5) % 10; h += '<span class="pp-bn" style="--sz:' + sz + 'px;--dx:' + ((big ? 26 : 96) + (i * 5.3) % 18).toFixed(1) + 's;--dy:' + ((big ? 15 : 60) + (i * 3.1) % 12).toFixed(1) + 's;--dl:-' + (i * 4.7).toFixed(1) + 's;color:' + cols[i % cols.length] + '">' + PSH[i % PSH.length] + '</span>'; } return h; };
  (function () { const tb = $("tb"); if (!tb) return; const d = el("div", "tb-bounce"); d.setAttribute("aria-hidden", "true"); d.innerHTML = BOUNCE(7, false); tb.insertBefore(d, tb.firstChild); })();
  // particle physics: shapes spread out, drift and bounce off walls and each other
  (function () {
    const ps = new Map(), still = matchMedia("(prefers-reduced-motion:reduce)").matches;
    const init = (box) => { const W = box.clientWidth, H = box.clientHeight, list = [], n = box.children.length; [...box.querySelectorAll(".pp-bn")].forEach((e, i) => { const r = e.offsetWidth / 2, a = Math.random() * 6.28, v = 0.25 + Math.random() * 0.3; list.push({ e, r, x: ((i + 0.5) / n) * W, y: r + Math.random() * Math.max(0, H - 2 * r), vx: Math.cos(a) * v, vy: Math.sin(a) * v }); }); return list; };
    let last = 0;
    const step = (t) => {
      const k = last ? Math.min((t - last) / 16.7, 3) : 1; last = t;
      [$("tb") && $("tb").querySelector(".tb-bounce"), $("mfAtmos")].forEach(box => {
        if (!box || !box.offsetWidth || !box.querySelector(".pp-bn")) return;
        let L = ps.get(box); if (!L || !L.length || !L[0].e.isConnected) { L = init(box); ps.set(box, L); }
        const W = box.clientWidth, H = box.clientHeight;
        if (!still) for (const p of L) { p.x += p.vx * k; p.y += p.vy * k; if (p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx); } if (p.x > W - p.r) { p.x = W - p.r; p.vx = -Math.abs(p.vx); } const top = Math.min(p.r, H / 2), bot = Math.max(H - p.r, H / 2); if (p.y < top) { p.y = top; p.vy = Math.abs(p.vy); } if (p.y > bot) { p.y = bot; p.vy = -Math.abs(p.vy); } }
        for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) { const a = L[i], b = L[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, m = a.r + b.r; if (d < m) { const nx = dx / d, ny = dy / d, o = (m - d) / 2; a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o; const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv < 0) { a.vx += rv * nx; a.vy += rv * ny; b.vx -= rv * nx; b.vy -= rv * ny; } } }
        for (const p of L) p.e.style.transform = "translate(" + (p.x - p.r).toFixed(1) + "px," + (p.y - p.r).toFixed(1) + "px)";
      });

    };
    requestAnimationFrame(step);
  })();
  function themeFooter(id) {

  (function buildFooter() {
